################
### MONITORS ###
################

#source = ~/.config/hypr/env-vars.conf
#source = ~/.config/hypr/colors.conf
# See https://wiki.hypr.land/Configuring/Monitors/
#monitor=,preferred,auto,auto
#monitor= DP-1, 3840x2160@240, 0x0, 1.5

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/graphics.conf
# Unscale XWayland apps to prevent them to look blurry
xwayland {
  force_zero_scaling = true
}

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

$scripts_dir = /home/alejandro/.nixos-config/scripts


# Set programs that you use
$terminal = alacritty
$fileManager = nemo
$menu = rofi -show drun
$reload_waybar = pkill waybar; waybar &
$hide_waybar = pkill waybar

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:


# Polkit agent:
exec-once = systemctl --user start hyprpolkitagent

# Bar
exec-once = waybar &
# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

# Night mode
exec-once = hyprsunset

# Notifications
exec-once = swaync

# Wallpaper daemon
exec-once = hyprpaper

# Idle daemon
exec-once = hypridle

# Monitor management
exec-once = hyprdynamicmonitors run

